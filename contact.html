<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Trend Crafters</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="canonical" href="https://trendcrafters.us/contact.html">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trendcrafters.us/contact.html">
    <meta property="og:title" content="Contact Us | Trend Crafters">
    <meta property="og:description" content="Connect with our expert team for dedicated wholesale support and premium product solutions.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1200">
</head>
<body>
    <!-- Shared Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Contact Hero -->
    <header class="hero visible" style="height: 40vh; background-image: url('contact-bg.jpg')">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>CONTACT <span class="highlight">US</span></h1>
            <p>Connect with our expert team for dedicated wholesale support and premium product solutions tailored to your business needs.</p>
        </div>
    </header>

    <!-- Contact Content -->
    <section class="contact-section reveal-up">
        <div class="container">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start;">
                <!-- Request Quote Form -->
                <div class="glass form-card">
                    <h2 class="form-group-mb">Send a <span class="highlight">Message</span></h2>
                    <form action="https://api.web3forms.com/submit" method="POST" id="quote-request-form">
                        <input type="hidden" name="access_key" value="51ffeffb-889e-4934-a4a5-17a90dbfa209">

                        <input type="hidden" name="subject" value="New Quote Request - Trend Crafters">
                        <input type="hidden" name="from_name" value="Trend Crafters Contact Form">
                        <div class="form-row">
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Full Name *</label>
                                <input type="text" name="full_name" required placeholder="Full Name" class="form-control-custom">
                            </div>
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Email *</label>
                                <input type="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter a valid email address" class="form-control-custom">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Phone *</label>
                                <input type="tel" name="phone" required pattern="[+]?[0-9]{10,15}" title="Please enter a valid phone number (10-15 digits, optional leading +)" class="form-control-custom">
                            </div>
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Company (optional)</label>
                                <input type="text" name="company" class="form-control-custom">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Product Name *</label>
                                <input type="text" name="product_name" required placeholder="Product Name" class="form-control-custom">
                            </div>
                            <div class="form-group form-group-mb">
                                <label class="label-bold">Quantity *</label>
                                <input type="number" name="quantity" required class="form-control-custom">
                            </div>
                        </div>
                        <div class="form-group form-group-mb">
                            <label class="label-bold">Message *</label>
                            <textarea rows="5" name="message" required placeholder="Tell us more about your requirements..." class="form-control-custom"></textarea>
                        </div>
                        <div class="form-group-mb flex-center-gap">
                            <input type="checkbox" name="is_wholesale" id="wholesale" class="checkbox-custom">
                            <label for="wholesale" class="cursor-pointer">This is a Wholesale/Bulk Inquiry</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 p-1rem font-1.1">Submit Quote Request</button>
                    </form>
                </div>

                <!-- Contact Info -->
                <div style="padding-top: 2rem;">
                    <h2 style="margin-bottom: 2rem;">Contact Information</h2>
                    <div style="display: flex; gap: 1.5rem; margin-bottom: 2rem;">
                        <i class="fa-solid fa-location-dot" style="font-size: 1.5rem; color: var(--accent-sage);"></i>
                        <div>
                            <h4 style="margin-bottom: 0.5rem;">Our Studio</h4>
                            <p style="color: var(--text-muted);">202 Shaw Rd South San Francisco, CA 94080 USA</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1.5rem; margin-bottom: 2rem;">
                        <i class="fa-solid fa-phone" style="font-size: 1.5rem; color: var(--accent-sage);"></i>
                        <div>
                            <h4 style="margin-bottom: 0.5rem;">Call Us</h4>
                            <p style="color: var(--text-muted);">+1 (307) 400-8168</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1.5rem; margin-bottom: 2rem;">
                        <i class="fa-solid fa-envelope" style="font-size: 1.5rem; color: var(--accent-sage);"></i>
                        <div>
                            <h4 style="margin-bottom: 0.5rem;">Email Us</h4>
                            <p style="color: var(--text-muted);">info@trendcrafters.us</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Map Section -->
    <section class="map-section" style="padding: 0;">
        <div class="container-fluid" style="width: 100%; height: 450px;">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3158.465137270425!2d-122.3994356!3d37.6617482!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808f799298538743%3A0x6b777a8342416f0b!2s202%20Shaw%20Rd%2C%20South%20San%20Francisco%2C%20CA%2094080%2C%20USA!5e0!3m2!1sen!2s!4v1714850000000!5m2!1sen!2s" 
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </section>

    <!-- Shared Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="components.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
