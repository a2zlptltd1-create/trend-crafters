<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Registration | Trend Crafters</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="background-color: var(--bg-primary); padding-top: 2rem;">

    <div class="container">
        <div class="auth-card animate-fade">
            <div class="auth-header">
                <div class="logo" style="margin-bottom: 1.5rem;">
                    <a href="index.html" class="no-decoration"><span class="trend" style="color: var(--accent-navy);">TREND</span><span class="crafters" style="color: var(--accent-gold);">CRAFTERS</span></a>
                </div>
                <h2>Wholesale Registration</h2>
                <p>Apply for a business account to access our wholesale portal.</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="business-name">Business Name</label>
                        <input type="text" id="business-name" class="form-control" placeholder="Legal business name" required>
                    </div>
                    <div class="form-group">
                        <label for="business-type">Business Type</label>
                        <select id="business-type" class="form-control" required>
                            <option value="">Select Type</option>
                            <option value="retailer">Retailer</option>
                            <option value="wholesaler">Wholesaler</option>
                            <option value="distributor">Distributor</option>
                            <option value="boutique">Boutique Owner</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+1..." required>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" class="form-control" placeholder="USA, UK, etc." required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Request Wholesale Access
                </button>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="notifications.js"></script>
    <script src="components.js"></script>
    <script src="auth.js"></script>
</body>
</html>
